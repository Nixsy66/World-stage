<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Stage</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1120; --panel:#131C33; --panel2:#1A2540; --border:#27345A;
  --amber:#E8A33D; --amber-dim:#E8A33D40; --text:#ECE9E1; --muted:#8E96AC;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Spectral",Georgia,serif;
}
*{box-sizing:border-box}
html{font-size:clamp(15px,.35vw + 12px,18px); height:100%}
body{
  margin:0; background:var(--ink); color:var(--text); font-family:var(--sans);
  display:flex; flex-direction:column;
  height:100vh; height:100dvh;
  overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:var(--serif); margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 16px; border-bottom:1px solid var(--border); background:var(--panel);
  flex:none; z-index:10;
}
header h1{font-size:1.35rem; font-weight:600; line-height:1.1}
header p{margin:2px 0 0; font-size:.78rem; color:var(--muted)}
nav{display:flex; gap:6px; flex:none}
.tab{
  background:none; border:1px solid var(--border); color:var(--muted);
  padding:7px 14px; border-radius:6px; font-size:.82rem; cursor:pointer;
  white-space:nowrap; transition:color .15s,border-color .15s,background .15s;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--amber); border-color:var(--amber-dim); background:var(--panel2)}

main{flex:1; display:flex; min-height:0; min-width:0}

.map-col{flex:1 1 auto; display:flex; flex-direction:column; min-width:0; min-height:0}
.map-wrap{
  flex:1; position:relative; overflow:hidden; min-height:0;
  cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
  background:radial-gradient(ellipse at 50% 40%, #12203d 0%, #080d19 100%);
  contain:strict;
}
.map-wrap.grab{cursor:grabbing}
#mapInner{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform}
#mapInner.ease{transition:transform .4s ease}
#mapInner img{
  width:100%; height:100%; display:block; pointer-events:none;
  -webkit-user-drag:none; user-drag:none;
  filter:saturate(.85) brightness(.92);
}
#pins,#draft{position:absolute; inset:0; pointer-events:none}

.pin{
  position:absolute; width:0; height:0; pointer-events:auto; cursor:pointer;
  opacity:1; transition:opacity .35s ease;
}
.pin.off{opacity:0 !important; pointer-events:none}
.pin.hl .halo{background:#E8A33D80}
.pin.sel .dot{border-color:#fff; border-width:3px}
.pi{
  position:absolute; left:0; top:0;
  /* counter-scale first, then translate in unscaled px so offsets look uniform */
  transform:translate(calc(var(--ox,0) * 1px), calc(var(--oy,0) * 1px)) scale(var(--inv,1));
  transform-origin:0 0;
}
.pi i{position:absolute; display:block; border-radius:50%; pointer-events:none}
.halo{
  left:-15px; top:-15px; width:30px; height:30px;
  background:var(--amber-dim); transition:background .15s;
}
.dot{
  left:-6px; top:-6px; width:12px; height:12px;
  background:var(--amber); border:2px solid var(--ink);
}
.pin:hover .halo{background:#E8A33D80}
.pin.pop .halo{
  transform-box:fill-box; transform-origin:center;
  animation:pop .7s ease-out;
}
@keyframes pop{
  from{transform:scale(.3); opacity:0}
  55%{transform:scale(2.2); opacity:.9}
  to{transform:scale(1); opacity:1}
}
.draft-pin{position:absolute; width:0; height:0; pointer-events:none}
.draft-pin .dhalo{
  position:absolute; left:-18px; top:-18px; width:36px; height:36px;
  border-radius:50%; border:2px dashed #fff; background:rgba(255,255,255,.08);
  transform:scale(var(--inv,1));
}

.zoom{position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:4px; z-index:5}
.zoom button{
  width:36px; height:36px; border-radius:7px;
  border:1px solid var(--border); background:var(--panel);
  cursor:pointer; font-size:1.05rem;
  box-shadow:0 4px 10px #0006;
  display:flex; align-items:center; justify-content:center;
  transition:border-color .15s,color .15s;
}
.zoom button:hover{border-color:var(--amber-dim); color:var(--amber)}
.badge{
  position:absolute; left:10px; bottom:10px; z-index:5;
  background:#0B1120d9; border:1px solid var(--border);
  padding:4px 9px; border-radius:6px;
  font-size:.75rem; color:var(--muted); pointer-events:none;
  max-width:calc(100% - 20px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#tip{
  position:absolute; z-index:6; pointer-events:none;
  background:var(--panel); border:1px solid var(--border);
  padding:4px 8px; border-radius:6px;
  font-size:.75rem; white-space:nowrap;
  transform:translate(-50%,-135%);
  display:none; box-shadow:0 4px 12px #0007;
  max-width:min(280px,80vw); overflow:hidden; text-overflow:ellipsis;
}

.timeline{flex:none; padding:8px 14px 10px; background:var(--panel); border-top:1px solid var(--border)}
.tl-top{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.year{
  font-family:var(--serif); font-weight:600;
  font-size:1.8rem; line-height:1; color:var(--amber);
  min-width:4ch; font-variant-numeric:tabular-nums;
}
.tl-opts{margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:.75rem; color:var(--muted)}
.tl-opts label{display:flex; align-items:center; gap:6px; margin:0}
select{background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:4px 6px; font-size:.75rem; cursor:pointer}
.tl-row{display:flex; align-items:center; gap:10px; margin-top:6px}
.play{
  flex:none; width:36px; height:36px; border-radius:50%;
  background:var(--panel2); border:1px solid var(--border);
  color:var(--amber); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:1rem;
  transition:border-color .15s;
}
.play:hover{border-color:var(--amber-dim)}
input[type=range]{flex:1; min-width:0; height:28px; accent-color:var(--amber); background:transparent; cursor:pointer}
.ticks{position:relative; height:16px; margin:0 4px 0 calc(36px + 10px); font-size:.7rem; color:var(--muted); font-variant-numeric:tabular-nums}
.ticks span{position:absolute; transform:translateX(-50%); white-space:nowrap}

aside{
  width:clamp(280px,26vw,360px); flex:none;
  display:flex; flex-direction:column; min-height:0;
  border-left:1px solid var(--border); background:var(--panel);
}
.panel-head{
  padding:10px 14px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex:none;
}
.panel-head h2{font-size:1.05rem; font-weight:600}
.panel-head input{width:140px; max-width:55%; font-size:.82rem; padding:5px 8px}
.panel-body{
  flex:1; min-height:0; overflow-y:auto;
  position:relative; padding:0 14px 14px;
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
}
input[type=text],input[type=search],input[type=date],input[type=url],input[type=number],textarea{
  width:100%; background:var(--panel2); border:1px solid var(--border);
  border-radius:6px; padding:7px 9px; font-size:.85rem;
}
textarea{min-height:70px; resize:vertical; font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--amber-dim); outline:none}

.item{
  display:flex; gap:9px; align-items:flex-start;
  width:100%; text-align:left; background:none; border:0;
  border-left:3px solid transparent;
  padding:8px 5px 8px 7px; cursor:pointer;
  border-bottom:1px solid #27345a80;
  transition:background .12s,border-color .12s;
}
.item:hover{background:var(--panel2)}
.item.live{border-left-color:var(--amber); background:#1a254080}
.num{flex:none; min-width:2.4ch; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); font-size:.75rem; padding-top:2px}
.it{display:flex; flex-direction:column; gap:2px; min-width:0}
.it b{font-weight:600; font-size:.88rem; line-height:1.3; word-break:break-word}
.it small{color:var(--muted); font-size:.72rem}
.empty,.hintp{color:var(--muted); font-size:.82rem; line-height:1.5; padding-top:12px}

.pager{
  position:sticky; top:0; z-index:2;
  display:flex; align-items:center; justify-content:space-between; gap:.5rem;
  background:var(--panel); padding:.6rem 0; border-bottom:1px solid var(--border);
}
.pgY{text-align:center; display:flex; flex-direction:column}
.pgY b{font:600 1.5rem/1 var(--serif); color:var(--amber)}
.pgY small{color:var(--muted); font-size:.75rem; margin-top:.15rem}
.pg{
  background:var(--panel2); border:1px solid var(--border);
  border-radius:8px; padding:.5rem .7rem; font-size:.82rem; cursor:pointer;
}
.pg:hover:not(:disabled){border-color:var(--amber-dim); color:var(--amber)}
.pg:disabled{opacity:.3; cursor:default}

.detail{padding-top:12px}
.detail h3{font-size:1.2rem; line-height:1.25; margin:2px 0 4px; word-break:break-word}
.detail .kicker,.detail .date{margin:0; font-size:.78rem; color:var(--muted)}
.detail .date{color:var(--amber); margin-bottom:10px}
.detail p{font-size:.86rem; line-height:1.55; max-width:60ch}
a.news{color:var(--amber); font-size:.8rem; text-decoration:none; border-bottom:1px solid var(--amber-dim)}
a.news:hover{border-bottom-color:var(--amber)}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.primary{background:var(--amber); color:#241705; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer}
.primary:hover{background:#f0b355}
.ghost{
  background:none; border:1px solid var(--border);
  border-radius:6px; padding:8px 12px; cursor:pointer;
  font-size:.82rem; transition:border-color .15s;
}
.ghost:hover:not(:disabled){border-color:var(--amber-dim)}
.ghost:disabled{opacity:.35; cursor:default}
label{display:block; font-size:.74rem; color:var(--muted); margin:10px 0 4px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}

@media (max-width:820px){
  main{flex-direction:column}
  aside{width:100%; height:42dvh; max-height:42dvh; border-left:0; border-top:1px solid var(--border)}
  header p{display:none}
  .year{font-size:1.5rem}
  .tl-opts{margin-left:0; width:100%; justify-content:space-between}
}
@media (max-height:560px){
  header p{display:none}
  .year{font-size:1.4rem}
  .ticks{display:none}
  header{padding:6px 12px}
  header h1{font-size:1.15rem}
  .timeline{padding:6px 10px 8px}
}
@media (pointer:coarse){
  .tab,.zoom button,.item,.ghost,.primary,.play{min-height:44px}
  .zoom button{width:44px; height:44px; font-size:1.2rem}
  .item{padding:10px 6px 10px 8px}
  .halo{left:-18px; top:-18px; width:36px; height:36px}
  .dot{left:-7px; top:-7px; width:14px; height:14px; border-width:2.5px}
}
@media (prefers-reduced-motion:reduce){
  .pin.pop .halo{animation:none}
  .pin,#mapInner.ease{transition:none}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>World Stage</h1>
    <p>Drag to pan, scroll or pinch to zoom, click the map to add an event.</p>
  </div>
  <nav>
    <button class="tab active" id="tabList" type="button">Events</button>
    <button class="tab" id="tabAdd" type="button">+ Add</button>
  </nav>
</header>

<main>
  <section class="map-col">
    <div class="map-wrap" id="mapWrap">
      <div id="mapInner">
        <img src="{{ url_for('static', filename='world-map-atlas-3840x2743-16642.jpg') }}"
             alt="World map" draggable="false"
             onerror="this.onerror=null;this.src='/world-map-atlas-3840x2743-16642.jpg'">
        <div id="pins"></div>
        <div id="draft"></div>
      </div>
      <div class="zoom">
        <button id="zoomIn" type="button" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" title="Zoom out" aria-label="Zoom out">&minus;</button>
        <button id="zoomReset" type="button" title="Reset view" aria-label="Reset view">&#8634;</button>
      </div>
      <div class="badge" id="badge"></div>
      <div id="tip"></div>
    </div>

    <div class="timeline">
      <div class="tl-top">
        <span class="year" id="yearLabel">&nbsp;</span>
        <div class="tl-opts">
          <label>Pins fade after
            <select id="lingerSel">
              <option value="1">this year</option>
              <option value="3" selected>3 years</option>
              <option value="10">10 years</option>
              <option value="0">never</option>
            </select>
          </label>
          <select id="speedSel" aria-label="Playback speed">
            <option value="600">Slow</option>
            <option value="300" selected>Normal</option>
            <option value="120">Fast</option>
          </select>
        </div>
      </div>
      <div class="tl-row">
        <button class="play" id="playBtn" type="button" title="Play" aria-label="Play">&#9654;</button>
        <input type="range" id="slider" min="1950" max="2026" value="2026" step="1" aria-label="Year">
      </div>
      <div class="ticks" id="ticks"></div>
    </div>
  </section>

  <aside>
    <div class="panel-head">
      <h2 id="panelTitle">Events</h2>
      <input type="search" id="search" placeholder="Search events" aria-label="Search events">
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</main>

<script>
"use strict";
(function(){
  const $ = id => document.getElementById(id);
  const wrap=$('mapWrap'), inner=$('mapInner');
  const pinsG=$('pins'), draftG=$('draft'), tip=$('tip');
  const body=$('panelBody'), panelTitle=$('panelTitle'), search=$('search');
  const tabList=$('tabList'), tabAdd=$('tabAdd');
  const slider=$('slider'), yearLabel=$('yearLabel');
  const lingerSel=$('lingerSel'), speedSel=$('speedSel'), playBtn=$('playBtn');

  /* ---------- Projection (calibrated cylindrical / Miller-style) ---------- */
  /*
     The supplied world-map image is not equirectangular. Its latitude
     graticule is vertically curved/non-linear, so a simple linear
     lat -> Y conversion causes the pins to drift away from the map.

     These calibration values are based on the supplied map image:
       - image size: 2048 x 1462
       - 0° longitude: approximately x=955.5
       - 0° latitude: approximately y=757.6
       - horizontal scale calibrated against the map graticule

     Keep all coordinate conversion in these two functions so pins,
     map-click coordinates, and manually entered coordinates remain
     consistent.
  */
  const MAP_W=2048, MAP_H=1462;

  const X0=955.5;                 // pixel position of longitude 0°
  const X180=1974.0;              // pixel position of longitude +180°
  const LON_SCALE=(X180-X0)/180;

  const Y0=757.6;                 // pixel position of latitude 0°
  const Y_SCALE=346.523;

  function millerY(lat){
    const phi=lat*Math.PI/180;
    return 1.25*Math.log(Math.tan(Math.PI/4+0.4*phi));
  }

  function invMillerY(v){
    return 2.5*(Math.atan(Math.exp(v/1.25))-Math.PI/4)*180/Math.PI;
  }

  const project=(lon,lat)=>{
    const x=X0+lon*LON_SCALE;
    const y=Y0-Y_SCALE*millerY(lat);
    return {fx:x/MAP_W, fy:y/MAP_H};
  };

  const unproject=(fx,fy)=>{
    const x=fx*MAP_W;
    const y=fy*MAP_H;
    return {
      lon:(x-X0)/LON_SCALE,
      lat:invMillerY((Y0-y)/Y_SCALE)
    };
  };

  let events=[], byId=new Map(), sel=null, mode='list', pending=null, timer=null;
  const view={s:1,x:0,y:0}, size={w:MAP_W,h:MAP_H};

  /* ---------- Pan & zoom ---------- */
  function fit(){
    const W=wrap.clientWidth, H=wrap.clientHeight;
    if(!W||!H) return;
    const k=Math.min(W/MAP_W,H/MAP_H);
    size.w=MAP_W*k; size.h=MAP_H*k;
    inner.style.width=size.w+'px';
    inner.style.height=size.h+'px';
    clamp(); apply();
  }
  function clamp(){
    const W=wrap.clientWidth, H=wrap.clientHeight;
    const sw=size.w*view.s, sh=size.h*view.s;
    view.x = sw<=W ? (W-sw)/2 : Math.min(0,Math.max(W-sw,view.x));
    view.y = sh<=H ? (H-sh)/2 : Math.min(0,Math.max(H-sh,view.y));
  }
  function apply(){
    inner.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;
    inner.style.setProperty('--inv',(1/view.s).toFixed(4));
  }
  function zoomAt(f,cx,cy){
    const ns=Math.min(14,Math.max(1,view.s*f));
    const r=ns/view.s;
    view.x=cx-(cx-view.x)*r;
    view.y=cy-(cy-view.y)*r;
    view.s=ns;
    clamp(); apply();
  }
  const mid=()=>[wrap.clientWidth/2, wrap.clientHeight/2];
  $('zoomIn').addEventListener('click',()=>zoomAt(1.4,...mid()));
  $('zoomOut').addEventListener('click',()=>zoomAt(1/1.4,...mid()));
  $('zoomReset').addEventListener('click',()=>{view.s=1;view.x=0;view.y=0;clamp();apply();});

  if(window.ResizeObserver) new ResizeObserver(fit).observe(wrap);
  else window.addEventListener('resize',fit);

  /* ---------- Pointer handling ---------- */
  const ptrs=new Map();
  let moved=false, rafPending=false;

  wrap.addEventListener('pointerdown',e=>{
    if(e.target.closest('.zoom')) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
    moved=false;
    wrap.classList.add('grab');
    try{ wrap.setPointerCapture(e.pointerId); }catch(_){}
  });

  window.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);
    if(!p) return;
    const prev=[...ptrs.values()].map(q=>({x:q.x,y:q.y}));
    p.x=e.clientX; p.y=e.clientY;
    if(Math.hypot(p.x-p.sx,p.y-p.sy)>5) moved=true;
    const now=[...ptrs.values()];
    const r=wrap.getBoundingClientRect();

    if(now.length===1){
      view.x+=now[0].x-prev[0].x;
      view.y+=now[0].y-prev[0].y;
    } else if(now.length>=2){
      const d0=Math.hypot(prev[0].x-prev[1].x,prev[0].y-prev[1].y);
      const d1=Math.hypot(now[0].x-now[1].x,now[0].y-now[1].y);
      view.x+=(now[0].x+now[1].x-prev[0].x-prev[1].x)/2;
      view.y+=(now[0].y+now[1].y-prev[0].y-prev[1].y)/2;
      moved=true; hideTip();
      if(d0>0) zoomAt(d1/d0,
        (now[0].x+now[1].x)/2-r.left,
        (now[0].y+now[1].y)/2-r.top);
    }
    if(!rafPending){
      rafPending=true;
      requestAnimationFrame(()=>{ rafPending=false; clamp(); apply(); });
    }
  },{passive:true});

  function release(e){
    ptrs.delete(e.pointerId);
    if(!ptrs.size) wrap.classList.remove('grab');
  }
  window.addEventListener('pointerup',release);
  window.addEventListener('pointercancel',release);

  wrap.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=wrap.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top);
  },{passive:false});

  wrap.addEventListener('click',e=>{
    if(moved||e.target.closest('.pin')||e.target.closest('.zoom')) return;
    const r=inner.getBoundingClientRect();
    const fx=(e.clientX-r.left)/r.width;
    const fy=(e.clientY-r.top)/r.height;
    if(fx<0||fx>1||fy<0||fy>1) return;
    pending=unproject(fx,fy);
    drawDraft();
    show('add');
  });

  function drawDraft(){
    draftG.innerHTML='';
    if(!pending) return;
    const {fx,fy}=project(pending.lon,pending.lat);
    const d=document.createElement('div');
    d.className='draft-pin';
    d.style.left=(fx*100)+'%';
    d.style.top=(fy*100)+'%';
    d.innerHTML='<i class="dhalo"></i>';
    draftG.appendChild(d);
  }

  function focusOn(ev){
    const {fx,fy}=project(ev.lon,ev.lat);
    view.x=wrap.clientWidth/2 - fx*size.w*view.s;
    view.y=wrap.clientHeight/2 - fy*size.h*view.s;
    clamp();
    inner.classList.add('ease'); apply();
    setTimeout(()=>inner.classList.remove('ease'),450);
  }

  /* ---------- Data ---------- */
  async function fetchEvents(){
    try{
      const r=await fetch('/api/events',{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const data=await r.json();
      events=Array.isArray(data) ? data : [];
    }catch(err){
      console.warn('Failed to fetch events:',err);
      events=[];
    }
    events.sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title));
    byId=new Map();
    events.forEach((ev,i)=>{ ev.n=i+1; ev.y=+ev.date.slice(0,4); byId.set(ev.id,ev); });
    sel = sel ? (byId.get(sel.id)||null) : null;
    buildPins();
    setupRange();
    updatePins();
    show(mode==='detail'&&sel ? 'detail' : mode==='add' ? 'add' : 'list');
  }
  async function saveNewEvent(ev){
    const r=await fetch('/api/events',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(ev)
    });
    if(!r.ok) throw new Error('Save failed: '+r.status);
    await fetchEvents();
  }
  async function removeEvent(id){
    await fetch('/api/events/'+encodeURIComponent(id),{method:'DELETE'});
    await fetchEvents();
  }

  /* ---------- Pins ---------- */
  function buildPins(){
    pinsG.innerHTML='';
    events.forEach(ev=>{
      const {fx,fy}=project(ev.lon,ev.lat);
      const g=document.createElement('div');
      g.className='pin off';
      g.style.left=(fx*100)+'%';
      g.style.top=(fy*100)+'%';
      g.innerHTML='<div class="pi"><i class="halo"></i><i class="dot"></i></div>';
      g.addEventListener('click',e=>{
        if(moved) return;
        e.stopPropagation();
        select(ev);
      });
      g.addEventListener('pointerenter',e=>showTip(ev,e));
      g.addEventListener('pointerleave',hideTip);
      g.addEventListener('animationend',()=>g.classList.remove('pop'));
      ev.el=g; ev.pi=g.firstChild; ev.on=false; ev.live=false;
      pinsG.appendChild(g);
    });
  }
  function showTip(ev,e){
    if(e.pointerType==='touch'||ptrs.size) return;
    const r=wrap.getBoundingClientRect();
    tip.textContent=ev.y+': '+ev.title;
    const x=Math.min(Math.max(e.clientX-r.left,90),Math.max(90,r.width-90));
    tip.style.left=x+'px';
    tip.style.top=(e.clientY-r.top)+'px';
    tip.style.display='block';
  }
  function hideTip(){ tip.style.display='none'; }

  /* ---------- Pin visibility & fade ----------
     visible if:  Y >= event.y  AND  (L===0 OR Y - event.y < L)
     selected pin is always visible.
     opacity fades linearly from 1 -> 0.25 across the linger window.
     when Y - event.y >= L the pin is hard-hidden (.off).
  */
  function updatePins(){
    const Y=+slider.value;
    const L=+lingerSel.value;
    const seen=new Map();
    let count=0;

    events.forEach(ev=>{
      const age=Y-ev.y;
      const appeared = age>=0;
      const withinWindow = L===0 || age < L;
      const live = appeared && withinWindow;
      const on = live || ev===sel;

      if(on){
        if(live) count++;

        // Fan out pins at (roughly) the same location
        const key=ev.lat.toFixed(1)+','+ev.lon.toFixed(1);
        const k=seen.get(key)||0;
        seen.set(key,k+1);
        if(k>0){
          const angle=(k-1)*2.399963; // golden angle, more even than 72°
          const radius=3.2*Math.sqrt(k);
          ev.pi.style.setProperty('--ox',(Math.cos(angle)*radius).toFixed(2));
          ev.pi.style.setProperty('--oy',(Math.sin(angle)*radius).toFixed(2));
        } else {
          ev.pi.style.setProperty('--ox',0);
          ev.pi.style.setProperty('--oy',0);
        }

        // Fade over linger window (only for live, non-selected pins)
        if(L>0 && live && ev!==sel){
          const t = Math.min(1, age/L);       // 0 at appearance, 1 at vanish
          ev.el.style.opacity = (1 - t).toFixed(3);
        } else {
          ev.el.style.opacity = 1;
        }

        if(!ev.on) ev.el.classList.add('pop');
      } else {
        ev.el.style.opacity = 0;
      }

      ev.el.classList.toggle('off',!on);
      ev.el.classList.toggle('sel',ev===sel);
      ev.on=on;
      ev.live=live;
    });

    $('badge').textContent = count + (count===1?' event':' events') + ' in view';

    body.querySelectorAll('.item').forEach(b=>{
      const ev=byId.get(b.dataset.id);
      b.classList.toggle('live',!!(ev&&ev.live));
    });
  }

  /* ---------- Timeline ---------- */
  function setupRange(){
    if(!events.length){
      slider.disabled = true;
      yearLabel.textContent = '—';
      $('ticks').innerHTML = '';
      return;
    }
    slider.disabled = false;
    const ys=events.map(e=>e.y);
    const lo=Math.min(...ys), hi=Math.max(...ys);
    const keep=+slider.value;
    slider.min=lo; slider.max=hi;
    if(!slider.dataset.init || keep<lo || keep>hi) slider.value=hi;
    slider.dataset.init=1;
    yearLabel.textContent=slider.value;

    const range=hi-lo||1;
    const step = range<=20 ? 5 : range<=60 ? 10 : 25;
    let t='';
    for(let y=Math.ceil(lo/step)*step; y<=hi; y+=step){
      t += '<span style="left:' + ((y-lo)/range*100).toFixed(2) + '%">' + y + '</span>';
    }
    $('ticks').innerHTML=t;
  }
  function onYear(){
    yearLabel.textContent=slider.value;
    updatePins();
    if(mode==='list') renderList();
  }
  function stopPlay(){
    if(timer){ clearInterval(timer); timer=null; }
    playBtn.innerHTML='&#9654;';
    playBtn.title='Play';
  }
  function startPlay(){
    if(+slider.value>=+slider.max){ slider.value=slider.min; onYear(); }
    playBtn.innerHTML='&#10074;&#10074;';
    playBtn.title='Pause';
    timer=setInterval(()=>{
      if(+slider.value>=+slider.max){ stopPlay(); return; }
      slider.value=+slider.value+1;
      onYear();
    },+speedSel.value);
  }
  playBtn.addEventListener('click',()=> timer ? stopPlay() : startPlay());
  speedSel.addEventListener('change',()=>{ if(timer){ stopPlay(); startPlay(); } });
  lingerSel.addEventListener('change',updatePins);
  slider.addEventListener('input',()=>{ stopPlay(); onYear(); });

  /* ---------- Side panel ---------- */
  function show(which){
    mode=which;
    tabList.classList.toggle('active',which!=='add');
    tabAdd.classList.toggle('active',which==='add');
    search.hidden = which!=='list';
    if(which==='add') renderAdd();
    else if(which==='detail' && sel) renderDetail(sel);
    else { mode='list'; renderList(); }
    if(which!=='add'){ pending=null; drawDraft(); }
  }
  tabList.addEventListener('click',()=>{ sel=null; updatePins(); show('list'); });
  tabAdd.addEventListener('click',()=>show('add'));
  search.addEventListener('input',renderList);

  function renderList(){
    panelTitle.textContent='Events';
    if(!events.length){
      body.innerHTML='<p class="empty">No events yet. Click the map to place the first one.</p>';
      return;
    }
    const q=search.value.trim().toLowerCase();
    const Y=+slider.value;
    let list, head;

    if(q){
      list=events.filter(ev=>(ev.title+' '+(ev.description||'')+' '+ev.y).toLowerCase().includes(q));
      head='<p class="hintp">'+list.length+' matching '+(list.length===1?'event':'events')+'</p>';
    } else {
      list=events.filter(ev=>ev.y===Y);
      const yrs=[...new Set(events.map(e=>e.y))];
      const pv=yrs.filter(y=>y<Y).pop();
      const nx=yrs.find(y=>y>Y);
      head='<div class="pager">'
        + '<button class="pg" type="button" data-y="'+(pv||'')+'" '+(pv?'':'disabled')+'>&lsaquo; '+(pv||'')+'</button>'
        + '<div class="pgY"><b>'+Y+'</b><small>'+list.length+' '+(list.length===1?'event':'events')+'</small></div>'
        + '<button class="pg" type="button" data-y="'+(nx||'')+'" '+(nx?'':'disabled')+'>'+(nx||'')+' &rsaquo;</button>'
        + '</div>';
    }
    const rows=list.map(ev=>
      '<button class="item" type="button" data-id="'+escapeAttr(ev.id)+'">'
      + '<span class="num">'+ev.n+'</span>'
      + '<span class="it"><b>'+escapeHtml(ev.title)+'</b>'
      + '<small>'+(q?ev.y+', ':'')+shortDate(ev.date)+'</small></span>'
      + '</button>'
    ).join('');
    body.innerHTML = head + (rows || '<p class="empty">No events recorded in '+Y+'. Use the arrows to jump to the nearest year that has some.</p>');
    body.scrollTop=0;
  }

  body.addEventListener('click',e=>{
    const g=e.target.closest('.pg');
    if(g && g.dataset.y && !g.disabled){
      stopPlay();
      slider.value=g.dataset.y;
      onYear();
      return;
    }
    const b=e.target.closest('.item');
    if(b) select(byId.get(b.dataset.id));
  });
  body.addEventListener('pointerover',e=>{
    const b=e.target.closest('.item');
    if(b){ const ev=byId.get(b.dataset.id); if(ev&&ev.el) ev.el.classList.add('hl'); }
  });
  body.addEventListener('pointerout',e=>{
    const b=e.target.closest('.item');
    if(b){ const ev=byId.get(b.dataset.id); if(ev&&ev.el) ev.el.classList.remove('hl'); }
  });

  function select(ev){
    if(!ev) return;
    stopPlay();
    sel=ev;
    slider.value=ev.y;
    yearLabel.textContent=ev.y;
    updatePins();
    focusOn(ev);
    show('detail');
  }

  function renderDetail(ev){
    panelTitle.textContent='Event';
    const q=encodeURIComponent(ev.title+' '+ev.y);
    const prev=events[ev.n-2];
    const next=events[ev.n];
    body.innerHTML=
      '<article class="detail">'
      + '<p class="kicker">Event '+ev.n+' of '+events.length+'</p>'
      + '<h3>'+escapeHtml(ev.title)+'</h3>'
      + '<p class="date">'+formatDate(ev.date)+', '+ev.lat.toFixed(2)+'&deg;, '+ev.lon.toFixed(2)+'&deg;</p>'
      + '<p>'+escapeHtml(ev.description||'')+'</p>'
      + (ev.link ? '<p><a class="news" href="'+escapeAttr(ev.link)+'" target="_blank" rel="noopener">Open saved article</a></p>' : '')
      + '<p><a class="news" href="https://www.google.com/search?q='+q+'&tbm=nws" target="_blank" rel="noopener">Search for news on this</a></p>'
      + '<div class="btn-row">'
      +   '<button class="ghost" type="button" id="prevBtn" '+(prev?'':'disabled')+'>Earlier</button>'
      +   '<button class="ghost" type="button" id="nextBtn" '+(next?'':'disabled')+'>Later</button>'
      + '</div>'
      + '<div class="btn-row">'
      +   '<button class="ghost" type="button" id="backBtn">Back to list</button>'
      +   '<button class="ghost" type="button" id="delBtn">Delete</button>'
      + '</div>'
      + '</article>';

    $('backBtn').addEventListener('click',()=>{ sel=null; updatePins(); show('list'); });
    if(prev) $('prevBtn').addEventListener('click',()=>select(prev));
    if(next) $('nextBtn').addEventListener('click',()=>select(next));
    $('delBtn').addEventListener('click',async()=>{
      if(confirm('Delete "'+ev.title+'"?')){
        sel=null; mode='list';
        await removeEvent(ev.id);
      }
    });
    body.scrollTop=0;
  }

  function renderAdd(){
    panelTitle.textContent='Add event';
    const c=pending;
    const lat=c?c.lat.toFixed(3):'';
    const lon=c?c.lon.toFixed(3):'';
    body.innerHTML=
      '<p class="hintp">'+(c
        ? 'Location set from the map. Adjust the coordinates if needed.'
        : 'Click the map to set a location, or type coordinates below.')+'</p>'
      + '<label for="fTitle">Title</label><input type="text" id="fTitle" placeholder="e.g. Treaty signed">'
      + '<label for="fDate">Date</label><input type="date" id="fDate">'
      + '<div class="two">'
      +   '<div><label for="fLat">Latitude</label><input type="number" id="fLat" step="any" min="-90" max="90" value="'+lat+'"></div>'
      +   '<div><label for="fLon">Longitude</label><input type="number" id="fLon" step="any" min="-180" max="180" value="'+lon+'"></div>'
      + '</div>'
      + '<label for="fDesc">Description</label><textarea id="fDesc" placeholder="A sentence or two of context"></textarea>'
      + '<label for="fLink">Article link (optional)</label><input type="url" id="fLink" placeholder="https://">'
      + '<div class="btn-row">'
      +   '<button class="primary" type="button" id="saveBtn">Save event</button>'
      +   '<button class="ghost" type="button" id="cancelBtn">Cancel</button>'
      + '</div>';

    ['fLat','fLon'].forEach(id=>{
      $(id).addEventListener('input',()=>{
        const la=parseFloat($('fLat').value);
        const lo=parseFloat($('fLon').value);
        pending = (isNaN(la)||isNaN(lo)) ? null : {lat:la,lon:lo};
        drawDraft();
      });
    });
    $('cancelBtn').addEventListener('click',()=>{ pending=null; drawDraft(); show('list'); });
    $('saveBtn').addEventListener('click',async()=>{
      const title=$('fTitle').value.trim();
      const date=$('fDate').value;
      const la=parseFloat($('fLat').value);
      const lo=parseFloat($('fLon').value);
      if(!title||!date){ alert('Add a title and a date.'); return; }
      if(isNaN(la)||isNaN(lo)){ alert('Set a location by clicking the map or entering coordinates.'); return; }
      const id='ev-'+Date.now();
      pending=null; drawDraft();
      try{
        await saveNewEvent({
          id, title, date,
          description:$('fDesc').value.trim(),
          link:$('fLink').value.trim(),
          lat:la, lon:lo
        });
        select(byId.get(id));
      }catch(err){
        alert('Failed to save: '+err.message);
      }
    });
  }

  /* ---------- Helpers ---------- */
  function escapeHtml(s){
    return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }
  const escapeAttr=escapeHtml;
  const parse=d=>new Date(d+'T00:00:00');
  const formatDate=d=>parse(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  const shortDate=d=>parse(d).toLocaleDateString(undefined,{month:'short',day:'numeric'});

  /* ---------- Boot ---------- */
  fit();
  fetchEvents();
})();
</script>
</body>
</html>
